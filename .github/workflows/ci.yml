name: CI Demo

# push（コードの送信）または pull_request が起きた時に起動
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest # 仮想実行環境

    steps:
      # 1. リポジトリのコードを仮想環境に取得
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Pythonのセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ライブラリのインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 black

      # flake8を使ってコード解析を行う
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-line-length=88 --statistics

      # blackを使ってコードをフォーマットする
      - name: Check formatting with Black
        run: |
          black --check .

      # 4. テストの実行（pytestをインストールして実行）
      - name: Run tests

        run: |
          pip install pytest
          pytest
